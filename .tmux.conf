bind-key h display-popup -w 80% -h 80% 'nvim $env:USERPROFILE\.config\tmux\tmux-config\help.md'

set -g mouse on
setw -g mode-keys vi

bind -T copy-mode-vi PPage send -X halfpage-up
bind -T copy-mode-vi NPage send -X halfpage-down

# Linux only: copy via xclip. On Windows (psmux) the check fails and psmux's built-in clipboard copy is used.
if-shell 'command -v xclip >/dev/null 2>&1' \
    'bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "xclip -in -selection clipboard"; bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "xclip -in -selection clipboard"'
