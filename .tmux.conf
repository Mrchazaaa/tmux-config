set -g mouse on
setw -g mode-keys vi

# psmux checks root before copy-mode tables, so paging lives here.
# PgUp: full-screen apps get the key; shell enters copy mode half a page up.
bind -n PPage if -F '#{alternate_on}' 'send-keys PPage' 'send -X halfpage-up'
# PgDn: half page down in copy mode; otherwise pass the key through.
bind -n NPage if -F '#{pane_in_mode}' 'send -X halfpage-down' 'send-keys NPage'

# Linux only: copy via xclip. On Windows (psmux) the check fails and psmux's built-in clipboard copy is used.
if-shell 'command -v xclip' {
  bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "xclip -in -selection clipboard"
  bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "xclip -in -selection clipboard"
}

