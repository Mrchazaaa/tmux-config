set -g mouse on
setw -g mode-keys vi

# PgUp: scroll history in the shell, pass through to full-screen apps (nvim, less, htop)
bind -n PPage if -F '#{alternate_on}' 'send-keys PPage' 'copy-mode ; send-keys PPage'

bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "xclip -in -selection clipboard"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "xclip -in -selection clipboard"

