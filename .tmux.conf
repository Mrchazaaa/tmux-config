set -g mouse on
setw -g mode-keys vi

bind -n PPage send-keys PPage 
bind -n NPage send-keys NPage

bind -T copy-mode-vi PPage send -X halfpage-up
bind -T copy-mode-vi NPage send -X halfpage-down

# Linux only: copy via xclip. On Windows (psmux) the check fails and psmux's built-in clipboard copy is used.
if-shell 'command -v xclip' {
  bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "xclip -in -selection clipboard"
  bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "xclip -in -selection clipboard"
}
